{% extends 'base.html' %}

{% block title %}{{ product.name }} - Detail Produk TechStore{% endblock %}

{% block content %}
<div class="container">
    <!-- Breadcrumb Navigation -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}" class="text-decoration-none">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
        </ol>
    </nav>

    <!-- Product Detail Card -->
    <div class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
        <div class="card-body p-4 p-md-5">
            <div class="row g-4 align-items-center">
                <!-- Product Image Column -->
                <div class="col-md-6 text-center">
                    <div class="bg-light rounded-4 p-3 d-flex align-items-center justify-content-center" style="min-height: 350px;">
                        <img src="{{ product.image }}" alt="{{ product.name }}" class="img-fluid rounded-3 style-img-detail" style="max-height: 380px; object-fit: contain;" onerror="this.onerror=null;this.src='https://via.placeholder.com/600x400?text=No+Image';">
                    </div>
                </div>

                <!-- Product Detail Column -->
                <div class="col-md-6">
                    <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill mb-3">Produk Original</span>
                    <h2 class="fw-bold text-dark mb-3">{{ product.name }}</h2>
                    <h3 class="text-primary fw-bold mb-4">{{ product.price | rupiah }}</h3>

                    <h6 class="fw-bold text-secondary mb-2">Deskripsi Produk:</h6>
                    <p class="text-muted leading-relaxed mb-4">
                        {{ product.description }}
                    </p>

                    <hr class="my-4 text-muted opacity-25">

                    <!-- Add to Cart Form -->
                    <form action="{{ url_for('add_to_cart') }}" method="POST">
                        <input type="hidden" name="product_id" value="{{ product.id }}">
                        
                        <div class="row g-3 align-items-center mb-4">
                            <div class="col-auto">
                                <label for="quantity" class="col-form-label fw-semibold text-secondary">Jumlah:</label>
                            </div>
                            <div class="col-auto" style="width: 110px;">
                                <input type="number" id="quantity" name="quantity" class="form-control text-center" value="1" min="1" max="99" required>
                            </div>
                            <div class="col-auto">
                                <span class="form-text text-muted">Unit</span>
                            </div>
                        </div>

                        <div class="d-flex flex-column flex-sm-row gap-3">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                                <i class="fa-solid fa-cart-plus me-2"></i> Tambah ke Keranjang
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-lg">
                                <i class="fa-solid fa-arrow-left me-2"></i> Kembali
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
