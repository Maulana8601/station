
name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deployments:
    name: Deployments
    runs-on: self-hosted
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          chmod 600 $HOME/.kube/config

      - name: Check Runner Environment
        run: |
          echo "---- User ----"
          whoami

          echo "---- HOME ----"
          echo "$HOME"

          echo "---- Kubeconfig File ----"
          ls -l "$HOME/.kube/config"

          echo "---- Terraform Provider Path ----"
          echo "$HOME/.kube/config"
          echo "---- Kubeconfig Content Check ----"
          test -s "$HOME/.kube/config" && echo "Kubeconfig is not empty" || echo "Kubeconfig is EMPTY"

      - name: Verify Kubernetes connection
        run: |
          echo "---- API Server ----"
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          echo

          echo "---- Nodes ----"
          kubectl get nodes

          echo "---- API Resources ----"
          kubectl api-resources | grep -E 'deployments|services'

      - name: Set image tag
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Deploying image: ghcr.io/maulana8601/station-app:$IMAGE_TAG"

      - name: Check Terraform Workspace
        run: |
          echo "---- Current Directory ----"
          pwd

          echo "---- Terraform Directory ----"
          ls -lah ./terraform

          echo "---- Terraform State ----"
          if [ -f ./terraform/terraform.tfstate ]; then
            ls -lh ./terraform/terraform.tfstate
          else
            echo "Terraform state tidak ditemukan"
          fi

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="app_image=ghcr.io/maulana8601/station-app:${IMAGE_TAG}"

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/station-app \
            --timeout=120s

      - name: Verify deployment
        run: |
          echo "---- Pods ----"
          kubectl get pods -l app=station-app -o wide

          echo "---- Services ----"
          kubectl get services station-app