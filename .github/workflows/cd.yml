name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deployments:
    name: Deployments
    runs-on: self-hosted
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure kubectl
        run: |
          mkdir -p "$HOME/.kube"
          cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config"
          chmod 600 $HOME/.kube/config

      - name: Check Runner Environment
        run: |
          echo "---- User ----"
          whoami
          echo "---- HOME ----"
          echo "$HOME"
          echo "---- Kubeconfig File ----"
          ls -l "$HOME/.kube/config"
          test -s "$HOME/.kube/config" && echo "Kubeconfig is not empty" || echo "Kubeconfig is EMPTY"

      - name: Verify Kubernetes connection
        run: |
          echo "---- API Server ----"
          kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}'
          echo
          echo "---- Nodes ----"
          kubectl get nodes

      - name: Set image tag
        run: |
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Deploying image: ghcr.io/maulana8601/station-app:$IMAGE_TAG"

      # === LANGKAH 1: AMBIL STATE LAMA DARI LUAR WORKSPACE ===
      - name: Restore Terraform State
        run: |
          mkdir -p "$HOME/.terraform_states/station-app"
          if [ -f "$HOME/.terraform_states/station-app/terraform.tfstate" ]; then
            echo "Menemukan state sebelumnya. Menyalin ke folder project..."
            cp "$HOME/.terraform_states/station-app/terraform.tfstate" ./terraform/terraform.tfstate
          else
            echo "State tidak ditemukan di storage server. Ini dianggap run bersih."
          fi

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      # === LANGKAH TINGKAT LANJUT: ONE-TIME RECONCILIATION ===
      # Jika state kosong tetapi aplikasi sudah ada di K3s, kita paksa Terraform mengenali objek tersebut.
      - name: Auto Import If State Missing
        working-directory: ./terraform
        run: |
          if ! terraform state list | grep -q "kubernetes_deployment_v1"; then
            echo "State kosong tetapi aplikasi mungkin ada di kluster. Mencoba melakukan Sinkronisasi/Import..."
            terraform import -var="app_image=ghcr.io/maulana8601/station-app:${IMAGE_TAG}" kubernetes_deployment_v1.station default/station-app || echo "Deployment belum ada di K3s, lanjut..."
            terraform import -var="app_image=ghcr.io/maulana8601/station-app:${IMAGE_TAG}" kubernetes_service_v1.station default/station-app || echo "Service belum ada di K3s, lanjut..."
          fi

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve \
            -var="app_image=ghcr.io/maulana8601/station-app:${IMAGE_TAG}"

      # === LANGKAH 2: AMANKAN STATE TERBARU KE LUAR WORKSPACE ===
      # Disimpan di dalam home directory server agar aman dari proses bersih-bersih Git git checkout selanjutnya.
      - name: Save Terraform State Securely
        if: always()
        run: |
          if [ -f ./terraform/terraform.tfstate ]; then
            echo "Mengamankan state terbaru ke direktori server..."
            cp ./terraform/terraform.tfstate "$HOME/.terraform_states/station-app/terraform.tfstate"
          fi

      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/station-app \
            --timeout=120s

      - name: Verify deployment
        run: |
          echo "---- Pods ----"
          kubectl get pods -l app=station-app -o wide
          echo "---- Services ----"
          kubectl get services station-app
